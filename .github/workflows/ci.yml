name: Verify XEDO

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run automated tests
        run: npm test

      - name: Build static deployment draft
        run: npm run build

      - name: Build retained workspace and Worker
        run: npm run build:workspace

      - name: Build standalone local file
        run: npm run build:file
